<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · AI Quote Agent</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    /* BRAND: keep in sync with index.html */
    .bg-brand { background: rgb(79 70 229); } .bg-brand:hover { background: rgb(67 56 202); }
    .from-brand { --tw-gradient-from: rgb(55 48 163); } .to-brand { --tw-gradient-to: rgb(99 102 241); }
  </style>
</head>
<body class="min-h-screen bg-slate-100 grid place-items-center px-4">
  <main class="w-full max-w-sm">
    <div class="flex items-center gap-3 mb-6 justify-center">
      <div class="w-10 h-10 rounded-xl bg-brand text-white grid place-items-center font-bold">Q</div>
      <div><h1 class="font-semibold text-lg leading-tight">AI Quote Agent</h1>
        <p class="text-xs text-slate-500">Draft quotations from customer emails</p></div>
    </div>
    <form id="form" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
      <div>
        <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Username</label>
        <input id="username" name="username" autocomplete="username" required value="admin"
               class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required
               class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <p id="error" class="hidden text-sm text-rose-700"></p>
      <button class="w-full bg-brand text-white rounded-lg py-2 text-sm font-medium">Sign in</button>
    </form>
  </main>
  <script>
    document.getElementById("form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const err = document.getElementById("error");
      err.classList.add("hidden");
      const res = await fetch("/api/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: ev.target.username.value, password: ev.target.password.value }),
      });
      if (res.ok) { location.href = "/" + location.hash; return; }
      const data = await res.json().catch(() => ({}));
      err.textContent = data.detail || "Sign-in failed";
      err.classList.remove("hidden");
    });
  </script>
</body>
</html>
